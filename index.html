<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ijtimoiy himoya — Namangan</title>
<meta name="description" content="Namangan viloyatidagi &quot;Inson&quot; ijtimoiy xizmatlar markazlari va ijtimoiy xizmatlar xaritada: manzil, telefon, ish vaqti va yo'nalish.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-screen app — sidebar (search, type chips, district filter, list, details) + Yandex map */
:root {
  --bg: #EEF2F7;
  --surface: #FFFFFF;
  --surface-2: #F5F8FB;
  --line: #D6DFEA;
  --text: #152233;
  --muted: #5B6B7F;
  --primary: #1B4F91;
  --primary-strong: #143D72;
  --primary-soft: #E5EDF8;
  --accent: #D9731C;
  --danger: #B4372B;
  --header: #1B4F91;
  --on-dark: #FFFFFF;
  --font: "Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0E1622;
    --surface: #152131;
    --surface-2: #1A2839;
    --line: #26374C;
    --text: #E3EAF3;
    --muted: #92A6BD;
    --primary: #3B7BC8;
    --primary-strong: #5B95DA;
    --primary-soft: #1B2E46;
    --accent: #F0913A;
    --danger: #EF7A6E;
    --header: #12253C;
    color-scheme: dark;
  }
}

*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { font-family: var(--font); font-size: 14px; background: var(--bg); color: var(--text); }
button, input, select { font: inherit; color: inherit; }
a { color: var(--primary); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 10px 16px; border-radius: 8px; border: 1.5px solid transparent;
  font-weight: 600; font-size: .88rem; cursor: pointer; text-decoration: none;
  transition: background-color .15s, border-color .15s;
}
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-strong); }
.btn-ghost { background: transparent; border-color: var(--line); color: var(--text); }
.btn-ghost:hover { border-color: var(--primary); }
.btn-block { flex: 1; }

/* ── App shell ── */
.app { display: flex; flex-direction: column; height: 100%; }
.app-header {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 16px; background: var(--header); color: var(--on-dark);
  padding-top: calc(10px + env(safe-area-inset-top, 0px));
  flex-shrink: 0;
}
.mark {
  width: 36px; height: 36px; border-radius: 8px; flex-shrink: 0;
  display: grid; place-items: center; background: rgba(255,255,255,.14);
}
.brand { min-width: 0; }
.brand-title { font-weight: 700; font-size: 1.02rem; line-height: 1.2; }
.brand-sub { font-size: .78rem; opacity: .78; }

.app-body { display: flex; flex: 1; min-height: 0; }

/* ── Sidebar ── */
.sidebar {
  width: 360px; flex-shrink: 0; min-width: 0; position: relative;
  display: flex; flex-direction: column;
  background: var(--surface); border-right: 1px solid var(--line);
}
.side-top { padding: 14px 16px 12px; display: grid; gap: 10px; border-bottom: 1px solid var(--line); min-width: 0; }
.search {
  display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px;
  border: 1.5px solid var(--line); border-radius: 8px; background: var(--surface-2);
}
.search:focus-within { border-color: var(--primary); }
.search svg { color: var(--muted); flex-shrink: 0; }
.search input { border: 0; outline: none; background: transparent; width: 100%; min-width: 0; }
.search input::placeholder { color: var(--muted); }

.types { display: flex; flex-wrap: wrap; gap: 6px; }
.type-chip {
  display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 11px;
  border-radius: 15px; border: 1.5px solid var(--line); background: var(--surface);
  font-size: .8rem; font-weight: 500; cursor: pointer; white-space: nowrap;
}
.type-chip:hover { border-color: var(--primary); }
.type-chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.type-chip[aria-pressed="true"] { border-color: var(--primary); background: var(--primary-soft); font-weight: 600; }
.type-chip .n { color: var(--muted); font-weight: 500; font-variant-numeric: tabular-nums; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--dot, var(--muted)); flex-shrink: 0; }

.select {
  height: 40px; padding: 0 10px; border-radius: 8px;
  border: 1.5px solid var(--line); background: var(--surface-2); width: 100%;
}
.select:focus { outline: none; border-color: var(--primary); }
.status { font-size: .78rem; color: var(--muted); line-height: 1.4; }

.list { flex: 1; overflow-y: auto; min-height: 0; }
.group-h {
  position: sticky; top: 0; z-index: 1;
  display: flex; justify-content: space-between; gap: 8px;
  padding: 7px 16px; background: var(--surface-2);
  border-bottom: 1px solid var(--line);
  font-size: .72rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted);
}
.group-h span { font-variant-numeric: tabular-nums; }
.office {
  display: grid; gap: 3px; width: 100%; text-align: left;
  padding: 11px 16px 11px 13px; background: none; cursor: pointer;
  border: 0; border-left: 3px solid transparent; border-bottom: 1px solid var(--line);
}
.office:hover { background: var(--surface-2); }
.office:focus-visible { outline: 2px solid var(--primary); outline-offset: -2px; }
.office.active { background: var(--primary-soft); border-left-color: var(--accent); }
.office-type { display: inline-flex; align-items: center; gap: 6px; font-size: .74rem; font-weight: 500; color: var(--muted); }
.office-name { font-weight: 600; font-size: .92rem; line-height: 1.3; }
.office-addr { font-size: .8rem; color: var(--muted); line-height: 1.4; }
.office-phone { font-size: .8rem; color: var(--primary); font-variant-numeric: tabular-nums; }

.notice { padding: 20px 18px; display: grid; gap: 12px; justify-items: start; line-height: 1.5; border-bottom: 1px solid var(--line); }
.notice p { margin: 0; }
.notice .muted { color: var(--muted); font-size: .85rem; }
.notice.error p:first-child { color: var(--danger); font-weight: 600; }
.notice code { font-size: .82rem; background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }
.loading-row { display: flex; align-items: center; gap: 10px; color: var(--muted); }
.spinner {
  width: 18px; height: 18px; border-radius: 50%;
  border: 2.5px solid var(--line); border-top-color: var(--primary);
  animation: spin .8s linear infinite; flex-shrink: 0;
}
.spinner.lg { width: 36px; height: 36px; border-width: 4px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ── Details panel ── */
.info {
  border-top: 1px solid var(--line); padding: 14px 16px 16px;
  display: grid; gap: 10px; max-height: 50%; overflow-y: auto; flex-shrink: 0;
  background: var(--surface);
}
.info-head { display: flex; align-items: flex-start; gap: 10px; }
.info-head h2 { margin: 0; font-size: 1rem; line-height: 1.35; flex: 1; text-wrap: balance; }
.info-close {
  border: 0; background: none; cursor: pointer; color: var(--muted);
  font-size: 1.3rem; line-height: 1; padding: 0 2px;
}
.info-cat { display: flex; align-items: center; gap: 6px; font-size: .78rem; color: var(--muted); margin-top: -4px; }
.info-rows { margin: 0; display: grid; gap: 8px; }
.info-rows div { display: grid; grid-template-columns: 76px 1fr; gap: 8px; }
.info-rows dt { font-size: .72rem; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); padding-top: 2px; }
.info-rows dd { margin: 0; font-size: .86rem; line-height: 1.45; min-width: 0; overflow-wrap: anywhere; }
.info-rows dd a { font-variant-numeric: tabular-nums; }
.info-actions { display: flex; gap: 8px; }

/* ── Map ── */
.map-area { flex: 1; position: relative; min-width: 0; background: var(--bg); }
#ymap { position: absolute; inset: 0; }
.map-msg {
  position: absolute; inset: 0; z-index: 5;
  display: grid; place-items: center; padding: 24px; background: var(--bg);
}
.map-msg-box { max-width: 360px; display: grid; gap: 12px; justify-items: center; text-align: center; line-height: 1.5; }
.map-msg-box p { margin: 0; }
.map-msg-box .title { font-weight: 700; }
.map-msg-box .muted { color: var(--muted); font-size: .86rem; }
.map-msg-box code { font-size: .82rem; background: var(--surface); padding: 1px 5px; border-radius: 4px; }

@media (max-width: 760px) {
  .app-body { flex-direction: column; }
  .sidebar { width: 100%; height: 52%; border-right: 0; border-bottom: 1px solid var(--line); }
  .side-top { gap: 8px; padding-block: 12px 10px; }
  .types { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
  .type-chip { flex-shrink: 0; }
  /* On phones the details replace the list inside the panel, so the map stays fully visible */
  .info { position: absolute; inset: 0; z-index: 3; max-height: none; border-top: 0; align-content: start; }
  .brand-sub { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .spinner { animation-duration: 2.4s; }
}
</style>
</head>
<body>

<div class="app" id="app">
  <header class="app-header">
    <div class="mark" aria-hidden="true">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M3 9.5 12 4l9 5.5"/><path d="M4 20h16"/><path d="M6 11v6M10 11v6M14 11v6M18 11v6"/></svg>
    </div>
    <div class="brand">
      <div class="brand-title">Ijtimoiy himoya xaritasi</div>
      <div class="brand-sub">Namangan viloyati · "Inson" markazlari va xizmatlar</div>
    </div>
  </header>

  <div class="app-body">
    <aside class="sidebar">
      <div class="side-top">
        <label class="search" for="q">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><circle cx="11" cy="11" r="7.5"/><path d="m20.5 20.5-4.2-4.2"/></svg>
          <input id="q" type="search" placeholder="Nomi yoki manzil bo'yicha qidirish" autocomplete="off">
        </label>
        <div class="types" id="types" role="group" aria-label="Xizmat turi"></div>
        <select class="select" id="district" aria-label="Tuman"></select>
        <div class="status" id="status-text"></div>
      </div>

      <div class="list" id="list" aria-live="polite"></div>

      <section class="info" id="info" hidden>
        <div class="info-head">
          <h2 id="info-name"></h2>
          <button class="info-close" id="info-close" type="button" aria-label="Yopish">×</button>
        </div>
        <div class="info-cat" id="info-cat"></div>
        <dl class="info-rows">
          <div id="row-desc"><dt>Xizmat</dt><dd id="info-desc"></dd></div>
          <div><dt>Manzil</dt><dd id="info-addr"></dd></div>
          <div id="row-phone"><dt>Telefon</dt><dd id="info-phone"></dd></div>
          <div id="row-hours"><dt>Ish vaqti</dt><dd id="info-hours"></dd></div>
          <div id="row-site"><dt>Sayt</dt><dd><a id="info-site" target="_blank" rel="noopener"></a></dd></div>
        </dl>
        <div class="info-actions">
          <a class="btn btn-ghost btn-block" id="info-route" target="_blank" rel="noopener">Yo'nalish</a>
          <a class="btn btn-primary btn-block" id="info-ymaps" target="_blank" rel="noopener">Yandex Xaritada</a>
        </div>
      </section>
    </aside>

    <div class="map-area">
      <div class="map-msg" id="map-msg">
        <div class="map-msg-box"><div class="spinner lg"></div><p class="muted">Xarita yuklanmoqda…</p></div>
      </div>
      <div id="ymap"></div>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';

const REGION_CENTER = [41.0, 71.55];
// Keeps only Yandex results that are "Inson" social services centres (checked on the name)
const RELEVANT = /инсон|inson|ijtimoiyxizmatlarmarkaz|ижтимоийхизматлармарказ|центр[а-я]*социальныхуслуг/;

// Yandex placemark colours (preset names) and their hex values for the chips and list dots
const COLOR_HEX = {
  blue: '#1E98FF', green: '#56DB40', violet: '#B51EFF', orange: '#FF931E', darkGreen: '#1BAD03',
  darkBlue: '#177BC9', lightBlue: '#82CDFF', pink: '#F371D1', yellow: '#FFD21E', brown: '#793D0E',
  olive: '#97A100', darkOrange: '#E6761B', night: '#0E4779', grey: '#B3B3B3', black: '#595959'
};
const SELECTED_PRESET = 'islands#redDotIcon';

// Type 1 is built in (found on Yandex); the services come from data/services.json
const OFFICE_TYPE = { id: 'office', name: '"Inson" Ijtimoiy xizmatlar markazi', short: '"Inson" Ijtimoiy xizmatlar markazi', color: 'blue', description: '' };
let TYPES = [OFFICE_TYPE];
const typeOf = id => TYPES.find(t => t.id === id) || OFFICE_TYPE;
const typeOrder = id => { const i = TYPES.findIndex(t => t.id === id); return i < 0 ? 99 : i; };

// Display order. Matching also runs in this order, so "Yangi Namangan" is tested before "Namangan tumani".
const DISTRICTS = [
  { id: 'city',          name: 'Namangan shahri',              stems: [] },
  { id: 'davlatobod',    name: 'Davlatobod tumani (Namangan sh.)', stems: ['davlatobod', 'давлатобод', 'давлатабад'] },
  { id: 'yanginamangan', name: 'Yangi Namangan tumani',        stems: ['yanginamangan', 'янгинаманган', 'новыйнаманган'] },
  { id: 'namangantuman', name: 'Namangan tumani',              stems: ['namangantumani', 'намангантумани', 'наманганскийрайон', 'toshbuloq', 'ташбулак', 'тошбулок'] },
  { id: 'chortoq',       name: "Chortoq tumani",               stems: ['chortoq', 'chartak', 'чорток', 'чартак'] },
  { id: 'chust',         name: 'Chust tumani',                 stems: ['chust', 'чуст'] },
  { id: 'kosonsoy',      name: 'Kosonsoy tumani',              stems: ['kosonsoy', 'kasansay', 'косонсой', 'касансай'] },
  { id: 'mingbuloq',     name: 'Mingbuloq tumani',             stems: ['mingbuloq', 'mingbulak', 'мингбулок', 'мингбулак', 'jomasho', 'jomashu', 'jumashu', 'джумашу', 'жумашу'] },
  { id: 'norin',         name: 'Norin tumani',                 stems: ['norin', 'naryn', 'норин', 'нарын', 'haqqulobod', 'хаккулабад', 'хаккулобод'] },
  { id: 'pop',           name: 'Pop tumani',                   stems: ['poptumani', 'поптумани', 'папский'], re: /(^|[^a-zа-я])(pop|пап|поп)([^a-zа-я]|$)/ },
  { id: 'toraqorgon',    name: "To'raqo'rg'on tumani",         stems: ['toraqorgon', 'turakurgan', 'туракурган', 'туракургон'] },
  { id: 'uchqorgon',     name: "Uchqo'rg'on tumani",           stems: ['uchqorgon', 'uchkurgan', 'учкурган', 'учкургон'] },
  { id: 'uychi',         name: 'Uychi tumani',                 stems: ['uychi', 'уйчи'] },
  { id: 'yangiqorgon',   name: "Yangiqo'rg'on tumani",         stems: ['yangiqorgon', 'yangikurgan', 'янгикурган', 'янгикургон'] },
  { id: 'other',         name: 'Tumani aniqlanmagan',          stems: [] }
];
const DIST_INDEX = Object.fromEntries(DISTRICTS.map((d, i) => [d.id, i]));
const DIST_NAME = Object.fromEntries(DISTRICTS.map(d => [d.id, d.name]));

/* ───────── Small helpers ───────── */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function norm(s) {
  return String(s || '').toLowerCase()
    .replace(/[ʻʼ'’‘`]/g, '')
    .replace(/ў/g, 'у').replace(/қ/g, 'к').replace(/ғ/g, 'г').replace(/ҳ/g, 'х').replace(/ё/g, 'е');
}
const squash = s => s.replace(/[\s\-–—.]/g, '');
const routeUrl = it => `https://yandex.uz/maps/?rtext=~${it.lat},${it.lon}&rtt=auto`;
const orgUrl = it => /^\d+$/.test(it.id) ? `https://yandex.uz/maps/?oid=${it.id}&ol=biz` : `https://yandex.uz/maps/?pt=${it.lon},${it.lat}&z=17&l=map`;
const telHref = p => 'tel:' + p.replace(/[^\d+]/g, '');
const dotHtml = color => `<span class="dot" style="--dot:${COLOR_HEX[color] || COLOR_HEX.grey}"></span>`;
const presetFor = it => it.id === state.selectedId ? SELECTED_PRESET : `islands#${typeOf(it.type).color}DotIcon`;
function fmtTime(ts) {
  const d = new Date(ts), p = n => String(n).padStart(2, '0');
  return `${p(d.getDate())}.${p(d.getMonth() + 1)}.${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
async function getJson(url) {
  const res = await fetch(url, { headers: { Accept: 'application/json' } });
  let body = null;
  try { body = await res.json(); } catch {}
  return { status: res.status, ok: res.ok, body };
}

/* ───────── Address → district ───────── */
// Only the administrative part of an address is checked (everything before the street),
// so a "Chust ko'chasi" inside Namangan city does not get filed under Chust tumani.
const STREET_RE = /(улиц|кучас|kuchas|kochas|проспект|prospekt|переулок|проезд|массив|mavze|мавзе|махалл|mahall|\d)/;
function adminParts(address) {
  const out = [];
  for (const raw of String(address || '').split(',')) {
    const p = norm(raw).trim();
    if (!p) continue;
    if (STREET_RE.test(p)) break;
    out.push(p);
  }
  return out;
}
function districtOf(address) {
  const parts = adminParts(address);
  for (const d of DISTRICTS) {
    if (!d.stems.length && !d.re) continue;
    for (const p of parts) {
      const s = squash(p);
      if (d.stems.some(st => s.includes(st)) || (d.re && d.re.test(p))) return d.id;
    }
  }
  const cityNames = ['наманган', 'namangan', 'namanganshahri', 'namanganshahar', 'городнаманган'];
  if (parts.some(p => cityNames.includes(squash(p)))) return 'city';
  return null;
}
const mentionsNamangan = address => adminParts(address).some(p => /наманган|namangan/.test(p));
// Yandex sometimes gives only "Namangan, <street>" for a district centre whose name says
// "Yangi Namangan tumani …". Used only when the address names no district.
function districtFromName(name) {
  const s = squash(norm(name));
  if (!/tuman|туман|район|rayon/.test(s)) return null;
  const d = DISTRICTS.find(d => d.stems.some(st => s.includes(st)));
  return d ? d.id : null;
}

/* ───────── Data: offices from Yandex ───────── */
function collectOffices(features) {
  const byId = new Map();
  for (const f of features || []) {
    const p = f.properties || {};
    const m = p.CompanyMetaData;
    const c = f.geometry && f.geometry.coordinates;
    if (!m || !c || typeof c[1] !== 'number') continue;
    const [lon, lat] = c;
    const id = String(m.id || `${lat.toFixed(5)},${lon.toFixed(5)}`);
    if (byId.has(id)) continue;
    const it = {
      id, type: 'office', lat, lon,
      name: m.name || p.name || '',
      address: m.address || p.description || '',
      phones: (m.Phones || []).map(x => x.formatted).filter(Boolean),
      hours: (m.Hours && m.Hours.text) || '',
      url: m.url || '',
      cats: (m.Categories || []).map(x => x.name).filter(Boolean)
    };
    if (!RELEVANT.test(squash(norm(it.name)))) continue;
    let dist = districtOf(it.address) || districtOf(p.description);
    if (!dist || dist === 'city') dist = districtFromName(it.name) || dist;
    if (!dist && !mentionsNamangan(it.address) && !mentionsNamangan(p.description)) continue;   // outside the region
    it.district = dist || 'other';
    byId.set(id, it);
  }
  return [...byId.values()];
}

/* ───────── Data: services from data/services.json ───────── */
function normalizeServices(data) {
  const services = (Array.isArray(data.services) ? data.services : [])
    .filter(s => s && s.id && s.name && s.id !== 'office')
    .map(s => ({
      id: String(s.id), name: String(s.name), short: String(s.short || s.name),
      color: COLOR_HEX[s.color] ? s.color : 'green', description: String(s.description || '')
    }));
  const known = new Set(services.map(s => s.id));
  const items = [];
  (Array.isArray(data.locations) ? data.locations : []).forEach((l, i) => {
    if (!l || !known.has(l.service)) return;
    const lat = Number(l.lat), lon = Number(l.lon);
    if (!Number.isFinite(lat) || !Number.isFinite(lon)) return;
    const phones = Array.isArray(l.phones) ? l.phones : (l.phone ? [l.phone] : []);
    items.push({
      id: 'svc-' + i, type: l.service, lat, lon,
      name: String(l.name || services.find(s => s.id === l.service).name),
      address: String(l.address || ''),
      phones: phones.map(String).filter(Boolean),
      hours: String(l.hours || ''),
      url: String(l.url || ''),
      cats: [],
      district: DIST_INDEX[l.district] !== undefined ? l.district : (districtOf(l.address) || 'other')
    });
  });
  return { services, items };
}

function describeError(status) {
  if (status === 403) return "Yandex qidiruv kaliti noto'g'ri yoki hali faollashmagan.";
  if (status === 429) return "Yandex so'rovlar limiti tugadi. Keyinroq qayta urinib ko'ring.";
  return "\"Inson\" markazlari ro'yxatini Yandex'dan olib bo'lmadi. Keyinroq qayta urinib ko'ring.";
}

/* ───────── State ───────── */
const state = {
  type: 'all', district: 'all', q: '', selectedId: null,
  offices: { status: 'loading', error: '', fetchedAt: 0, items: [] },
  services: { status: 'loading', items: [] }
};
// Yandex entries the site owner chose to leave off the map (data/hidden.json), matched by name + address
let HIDDEN = [];
const hiddenReady = getJson('/data/hidden.json').then(r => {
  if (r.ok && r.body && Array.isArray(r.body.offices)) {
    HIDDEN = r.body.offices.filter(h => h && h.name)
      .map(h => ({ name: squash(norm(h.name)), address: squash(norm(h.address || '')) }));
  }
}, () => {});
const isHidden = it => HIDDEN.some(h =>
  squash(norm(it.name)) === h.name && (!h.address || squash(norm(it.address)).includes(h.address)));

let ALL = [];
function rebuild() {
  ALL = [...state.offices.items, ...state.services.items].sort((a, b) =>
    (DIST_INDEX[a.district] - DIST_INDEX[b.district]) ||
    (typeOrder(a.type) - typeOrder(b.type)) ||
    a.name.localeCompare(b.name));
}
const matchesType = it => state.type === 'all' || it.type === state.type;
function visibleItems() {
  const q = squash(norm(state.q));
  return ALL.filter(it =>
    matchesType(it) &&
    (state.district === 'all' || it.district === state.district) &&
    (!q || squash(norm(it.name + ' ' + it.address)).includes(q)));
}

async function loadOffices() {
  const o = state.offices;
  o.status = 'loading'; renderAll(false);
  let r;
  try { r = await getJson('/api/offices'); }
  catch { r = { status: 0, ok: false, body: null }; }
  await hiddenReady;
  if (r.ok && r.body && Array.isArray(r.body.features)) {
    o.items = collectOffices(r.body.features).filter(it => !isHidden(it));
    o.fetchedAt = r.body.fetchedAt || Date.now();
    o.status = 'ok';
  } else if (r.status === 503 && r.body && r.body.error === 'nokey') {
    o.items = []; o.status = 'nokey';
  } else {
    o.items = []; o.status = 'error'; o.error = describeError(r.body && r.body.status);
  }
  rebuild();
  renderAll(true);
}

async function loadServices() {
  let r;
  try { r = await getJson('/data/services.json'); }
  catch { r = { ok: false, body: null }; }
  if (r.ok && r.body) {
    const { services, items } = normalizeServices(r.body);
    TYPES = [OFFICE_TYPE, ...services];
    state.services.items = items;
    state.services.status = 'ok';
  } else {
    state.services.status = 'error';
  }
  if (state.type !== 'all' && !TYPES.some(t => t.id === state.type)) state.type = 'all';
  rebuild();
  renderAll(true);
}

/* ───────── Sidebar rendering ───────── */
const listEl = $('list'), typesEl = $('types'), selectEl = $('district'), statusEl = $('status-text');

function renderTypes() {
  const counts = {};
  for (const it of ALL) counts[it.type] = (counts[it.type] || 0) + 1;
  const loading = state.offices.status === 'loading' || state.services.status === 'loading';
  const chip = (id, label, color, n) =>
    `<button type="button" class="type-chip" data-type="${esc(id)}" aria-pressed="${state.type === id}">` +
    `${color ? dotHtml(color) : ''}${esc(label)}${n === null ? '' : ` <span class="n">${n}</span>`}</button>`;
  const html = [chip('all', 'Hammasi', null, loading ? null : ALL.length)];
  for (const t of TYPES) {
    const ready = t.id === 'office' ? state.offices.status === 'ok' : state.services.status === 'ok';
    html.push(chip(t.id, t.short, t.color, ready ? (counts[t.id] || 0) : null));
  }
  typesEl.innerHTML = html.join('');
}

function renderSelect() {
  const pool = ALL.filter(matchesType);
  const counts = {};
  for (const it of pool) counts[it.district] = (counts[it.district] || 0) + 1;
  const opts = [`<option value="all">Barcha tumanlar (${pool.length})</option>`];
  for (const d of DISTRICTS) {
    if (d.id === 'other' && !counts.other) continue;
    opts.push(`<option value="${d.id}">${esc(d.name)} (${counts[d.id] || 0})</option>`);
  }
  selectEl.innerHTML = opts.join('');
  selectEl.value = state.district;
  if (selectEl.value !== state.district) { state.district = 'all'; selectEl.value = 'all'; }
}

function renderStatus() {
  const o = state.offices, parts = [];
  if (o.status === 'ok') parts.push(`\"Inson\" markazlari: ${o.items.length} (Yandex, ${fmtTime(o.fetchedAt)})`);
  else if (o.status === 'loading') parts.push("\"Inson\" markazlari qidirilmoqda…");
  else if (o.status === 'nokey') parts.push("\"Inson\" markazlari ro'yxati sozlanmagan");
  else parts.push("\"Inson\" markazlari yuklanmadi");
  if (state.services.status === 'ok') parts.push(`Xizmatlar: ${state.services.items.length} ta manzil`);
  else if (state.services.status === 'error') parts.push('Xizmatlar yuklanmadi');
  statusEl.textContent = parts.join(' · ');
}

function officeStateHtml() {
  const o = state.offices;
  if (o.status === 'loading') {
    return `<div class="notice"><div class="loading-row"><div class="spinner"></div><span>\"Inson\" markazlari qidirilmoqda…</span></div></div>`;
  }
  if (o.status === 'nokey') {
    if (state.type !== 'office') return '';
    return `<div class="notice">
      <p>\"Inson\" markazlari ro'yxati hozircha mavjud emas. Xaritadagi qidiruv maydoniga «Inson ijtimoiy xizmatlar markazi» deb yozib izlashingiz mumkin.</p>
      <p class="muted">Sayt egasi uchun: Vercel loyiha sozlamalarida <code>YANDEX_SEARCH_KEY</code> o'zgaruvchisini qo'shing va saytni qayta joylang.</p></div>`;
  }
  return `<div class="notice error"><p>${esc(o.error)}</p>
    <button class="btn btn-primary" type="button" data-action="retry">Qayta urinish</button></div>`;
}

function emptyHtml() {
  const t = state.type === 'all' ? null : typeOf(state.type);
  if (t && t.id !== 'office' && !ALL.some(i => i.type === t.id)) {
    return `<div class="notice"><p>«${esc(t.name)}» xizmati manzillari tez orada qo'shiladi.</p></div>`;
  }
  const where = state.district === 'all' ? 'Namangan viloyatida' : `${DIST_NAME[state.district]} hududida`;
  const what = !t ? 'markaz yoki xizmat' : t.id === 'office' ? '\"Inson\" ijtimoiy xizmatlar markazi' : `«${t.name}» xizmati`;
  const hint = t && t.id === 'office'
    ? `<p class="muted">Yandex bazasida markaz boshqa nom bilan yozilgan bo'lishi mumkin. Xaritani yaqinlashtirib, binolarni tekshirib ko'ring.</p>` : '';
  return `<div class="notice"><p>${esc(where)} ${esc(what)} topilmadi${state.q ? " (qidiruv bo'yicha)" : ''}.</p>${hint}</div>`;
}

function itemsHtml(items) {
  const html = [];
  let current = null;
  for (const it of items) {
    if (it.district !== current) {
      current = it.district;
      const n = items.filter(x => x.district === current).length;
      html.push(`<div class="group-h">${esc(DIST_NAME[current])}<span>${n}</span></div>`);
    }
    const t = typeOf(it.type);
    html.push(`<button type="button" class="office${it.id === state.selectedId ? ' active' : ''}" data-id="${esc(it.id)}">
      ${state.type === 'all' ? `<span class="office-type">${dotHtml(t.color)}${esc(t.name)}</span>` : ''}
      <span class="office-name">${esc(it.name)}</span>
      ${it.address ? `<span class="office-addr">${esc(it.address)}</span>` : ''}
      ${it.phones.length ? `<span class="office-phone">${esc(it.phones[0])}</span>` : ''}
    </button>`);
  }
  return html.join('');
}

function renderList() {
  const items = visibleItems();
  const officesShown = state.type === 'all' || state.type === 'office';
  const officeTrouble = officesShown && state.offices.status !== 'ok';
  const parts = [];
  if (officeTrouble) parts.push(officeStateHtml());
  if (state.services.status === 'error' && state.type !== 'office') {
    parts.push(`<div class="notice error"><p>Xizmatlar ro'yxatini yuklab bo'lmadi.</p></div>`);
  }
  if (items.length) parts.push(itemsHtml(items));
  else if (!(state.type === 'office' && officeTrouble) && !(state.type === 'all' && state.offices.status === 'loading')) parts.push(emptyHtml());
  listEl.innerHTML = parts.join('');
}

function renderAll(fit) {
  if (state.selectedId && !visibleItems().some(i => i.id === state.selectedId)) hideInfo();
  renderTypes();
  renderSelect();
  renderStatus();
  renderList();
  renderMarkers(fit);
}

listEl.addEventListener('click', e => {
  if (e.target.closest('[data-action="retry"]')) { loadOffices(); return; }
  const btn = e.target.closest('.office');
  if (btn) selectOffice(btn.dataset.id, false);
});
typesEl.addEventListener('click', e => {
  const chip = e.target.closest('.type-chip');
  if (!chip || chip.dataset.type === state.type) return;
  state.type = chip.dataset.type;
  renderAll(true);
});
selectEl.addEventListener('change', () => { state.district = selectEl.value; renderAll(true); });
$('q').addEventListener('input', e => { state.q = e.target.value; renderAll(true); });

/* ───────── Details panel ───────── */
function showInfo(it) {
  const t = typeOf(it.type);
  $('info-name').textContent = it.name;
  $('info-cat').innerHTML = dotHtml(t.color) + esc([t.name, DIST_NAME[it.district], ...it.cats.slice(0, 2)].join(' · '));
  $('row-desc').hidden = !t.description;
  $('info-desc').textContent = t.description;
  $('info-addr').textContent = it.address || '—';
  $('row-phone').hidden = !it.phones.length;
  $('info-phone').innerHTML = it.phones.map(p => `<a href="${esc(telHref(p))}">${esc(p)}</a>`).join('<br>');
  $('row-hours').hidden = !it.hours;
  $('info-hours').textContent = it.hours;
  $('row-site').hidden = !it.url;
  const site = $('info-site');
  site.textContent = it.url.replace(/^https?:\/\//, '').replace(/\/$/, '');
  site.href = /^https?:\/\//.test(it.url) ? it.url : 'https://' + it.url;
  $('info-route').href = routeUrl(it);
  $('info-ymaps').href = orgUrl(it);
  $('info').hidden = false;
}
function hideInfo() {
  state.selectedId = null;
  $('info').hidden = true;
}
function closeInfo() {
  hideInfo();
  listEl.querySelectorAll('.office.active').forEach(el => el.classList.remove('active'));
  updatePresets();
}
$('info-close').addEventListener('click', closeInfo);

function selectOffice(id, fromMap) {
  const it = ALL.find(x => x.id === id);
  if (!it) return;
  state.selectedId = id;
  listEl.querySelectorAll('.office').forEach(el => el.classList.toggle('active', el.dataset.id === id));
  const row = listEl.querySelector(`.office[data-id="${CSS.escape(id)}"]`);
  if (row) row.scrollIntoView({ block: 'nearest' });
  showInfo(it);
  updatePresets();
  if (map && !fromMap) {
    map.setCenter([it.lat, it.lon], Math.max(map.getZoom(), 15), { duration: 300 }).then(() => {
      const pm = placemarks.get(id);
      if (pm && clusterer && !clusterer.getObjectState(pm).isClustered) pm.balloon.open();
    }, () => {});
  }
}

/* ───────── Yandex map ───────── */
let map = null, clusterer = null;
const placemarks = new Map();

function loadYandexScript(key) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'https://api-maps.yandex.ru/2.1/?apikey=' + encodeURIComponent(key) + '&lang=ru_RU';
    s.onload = () => (window.ymaps ? ymaps.ready(resolve, reject) : reject(new Error('ymaps missing')));
    s.onerror = () => reject(new Error('load failed'));
    document.head.appendChild(s);
  });
}

function initMap(withSearchControl) {
  const controls = ['zoomControl', 'typeSelector', 'fullscreenControl', 'geolocationControl'];
  if (withSearchControl) controls.push('searchControl');
  map = new ymaps.Map('ymap', { center: REGION_CENTER, zoom: 9, controls });
  clusterer = new ymaps.Clusterer({ preset: 'islands#blueClusterIcons', groupByCoordinates: false });
  map.geoObjects.add(clusterer);
  $('map-msg').hidden = true;
  renderMarkers(true);
}

function showMapMessage(title, detail) {
  $('map-msg').hidden = false;
  $('map-msg').innerHTML = `<div class="map-msg-box"><p class="title">${title}</p><p class="muted">${detail}</p></div>`;
}

function balloonBody(it) {
  const rows = [`<span style="color:#5B6B7F">${esc(typeOf(it.type).name)}</span>`];
  if (it.address) rows.push(esc(it.address));
  if (it.phones.length) rows.push(it.phones.map(esc).join(', '));
  if (it.hours) rows.push(`<span style="color:#5B6B7F">${esc(it.hours)}</span>`);
  return `<div style="font:13px/1.5 system-ui,-apple-system,sans-serif;max-width:260px">${rows.join('<br>')}</div>`;
}

function renderMarkers(fit) {
  if (!map || !clusterer) return;
  clusterer.removeAll();
  placemarks.clear();
  const items = visibleItems();
  const marks = items.map(it => {
    const pm = new ymaps.Placemark([it.lat, it.lon], {
      hintContent: esc(it.name),
      clusterCaption: esc(it.name),
      balloonContentHeader: esc(it.name),
      balloonContentBody: balloonBody(it),
      balloonContentFooter: `<a href="${routeUrl(it)}" target="_blank" rel="noopener">Yo'nalish olish</a>`
    }, { preset: presetFor(it) });
    pm.events.add('click', () => selectOffice(it.id, true));
    placemarks.set(it.id, pm);
    return pm;
  });
  if (marks.length) clusterer.add(marks);
  if (!fit) return;
  if (marks.length === 1) {
    map.setCenter([items[0].lat, items[0].lon], 15, { duration: 300 });
  } else if (marks.length > 1) {
    map.setBounds(clusterer.getBounds(), { checkZoomRange: true, zoomMargin: 40, duration: 300 });
  } else {
    map.setCenter(REGION_CENTER, 9, { duration: 300 });
  }
}

function updatePresets() {
  for (const [id, pm] of placemarks) {
    const it = ALL.find(x => x.id === id);
    if (it) pm.options.set('preset', presetFor(it));
  }
}

/* ───────── Boot ───────── */
async function start() {
  renderAll(false);
  loadServices();
  let config = null;
  try {
    const r = await getJson('/api/config');
    if (r.ok) config = r.body;
  } catch {}

  if (!config) {
    showMapMessage('Sayt sozlamalari topilmadi', "Bu sahifa Vercel'ga joylangan holda ishlaydi. Faylni to'g'ridan-to'g'ri ochish o'rniga sayt manzili orqali oching.");
    state.offices.status = 'error'; state.offices.error = "Sayt sozlamalarini yuklab bo'lmadi.";
    renderAll(false);
    return;
  }

  if (config.jsKey) {
    loadYandexScript(config.jsKey)
      .then(() => initMap(!config.search))
      .catch(() => showMapMessage('Xarita yuklanmadi',
        "Yandex JavaScript API kaliti noto'g'ri, hali faollashmagan yoki kalit sozlamalarida bu sayt manzili (HTTP Referer) qo'shilmagan."));
  } else {
    showMapMessage('Xarita sozlanmagan', "Sayt egasi uchun: Vercel loyiha sozlamalarida <code>YANDEX_JS_KEY</code> o'zgaruvchisini qo'shing va saytni qayta joylang.");
  }
  loadOffices();
}
start();
})();
</script>
</body>
</html>
